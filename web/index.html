<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fomra LandIQ — Land & Property Management System by Fomra Housing">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fomra LandIQ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Inter font — loaded early so Flutter picks it up via fontFamily: 'Inter' -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <title>Fomra LandIQ — Fomra Housing</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }
    body {
      background: #f4f8ff;
      width: 100%;
    }
    flutter-view {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!-- Stub for passkeys_web (supabase_flutter transitive dep).
       The real Corbado bundle.js is not needed — we use email/password auth only.
       Without this stub, passkeys_web closes the browser window on startup. -->
  <script>
    window.PasskeyAuthenticator = {
      init: function() {},
      register: function() { return Promise.reject('passkeys not enabled'); },
      login: function() { return Promise.reject('passkeys not enabled'); },
      cancelCurrentAuthenticatorOperation: function() {},
      isUserVerifyingPlatformAuthenticatorAvailable: function() { return Promise.resolve(false); },
      isConditionalMediationAvailable: function() { return Promise.resolve(false); },
      hasPasskeySupport: function() { return false; }
    };
  </script>

  <!-- Visible loading screen — stays until Flutter's first frame fires -->
  <div id="loading" style="
    position:fixed;inset:0;
    background:linear-gradient(135deg,#0A2E6E 0%,#1565C0 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif;color:#fff;z-index:9999;gap:0;">
    <div style="
      width:64px;height:64px;border-radius:16px;
      background:rgba(255,255,255,0.15);
      display:flex;align-items:center;justify-content:center;
      margin-bottom:20px;
      box-shadow:0 8px 32px rgba(0,0,0,0.2);">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    <div style="font-size:26px;font-weight:800;letter-spacing:0.5px;">Fomra LandIQ</div>
    <div style="font-size:13px;font-weight:400;opacity:0.6;margin-top:4px;">Fomra Housing</div>
    <div style="margin-top:28px;width:32px;height:3px;border-radius:2px;background:rgba(255,255,255,0.3);overflow:hidden;">
      <div id="loading-bar" style="height:100%;width:0;background:#FFC107;border-radius:2px;animation:bar 1.6s ease-in-out infinite;"></div>
    </div>
    <div id="loading-sub" style="margin-top:14px;font-size:12px;opacity:.5;">Loading…</div>
  </div>
  <style>
    @keyframes bar { 0%{width:0;margin-left:0} 50%{width:100%;margin-left:0} 100%{width:0;margin-left:100%} }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading');
      if (el) el.style.display = 'none';
    });
    // If Flutter hasn't started within 12 seconds, show error hint
    setTimeout(function() {
      var sub = document.getElementById('loading-sub');
      if (sub) {
        sub.style.color = '#ff8a80';
        sub.textContent = 'Taking too long — open Console (F12) for errors';
      }
    }, 12000);
  </script>
  <script>
    // Disable ONLY the Flutter service worker so every deploy loads immediately
    // (the SW's Cache Storage otherwise serves a stale bundle one reload behind).
    // The Firebase Cloud Messaging worker (firebase-messaging-sw.js) MUST still
    // be allowed to register, or web push can't work.
    if ('serviceWorker' in navigator) {
      var __origRegister = navigator.serviceWorker.register.bind(navigator.serviceWorker);
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) {
          regs.forEach(function (r) {
            var sw = r.active || r.waiting || r.installing;
            var url = (sw && sw.scriptURL) || '';
            // ONLY remove Flutter's own SW. Never touch the FCM push worker —
            // an installing worker has an empty scriptURL, so a broad check
            // would wrongly kill firebase-messaging-sw.js mid-install.
            if (url.indexOf('flutter_service_worker') !== -1) r.unregister();
          });
        })
        .catch(function () {});
      navigator.serviceWorker.register = function (script, opts) {
        if (typeof script === 'string' && script.indexOf('firebase-messaging-sw') !== -1) {
          return __origRegister(script, opts); // forward scope/options
        }
        return Promise.reject(new Error('service worker disabled'));
      };
      // Our own app-shell worker (app_sw.js): network-first, so deploys still
      // show at once, but the app can open with no signal in the field.
      window.addEventListener('load', function () {
        __origRegister('app_sw.js', { scope: '/' }).catch(function () {});
      });
    }
  </script>

  <!-- Firebase JS SDK (loaded before Flutter so firebase_core_web can init). -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
