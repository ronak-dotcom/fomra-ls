name: fomra_ls
description: FomraLS - Land & Property Management System for Fomra Housing
publish_to: 'none'
version: 1.0.1+37

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  fl_chart: ^0.66.2
  geolocator: ^13.0.0
  connectivity_plus: ^6.1.4
  # IndexedDB for photos queued offline (lib/services/offline_blob_store_web.dart).
  web: ^1.1.1
  path_provider: ^2.1.5
  record: ^7.1.1
  audioplayers: ^6.4.0
  http: ^1.2.0
  file_picker: ^8.0.0
  image_picker: ^1.1.2
  image: ^4.5.4
  flutter_map: ^7.0.2
  flutter_map_cancellable_tile_provider: ^3.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  supabase_flutter: ^2.5.0
  pdf: ^3.11.1
  printing: ^5.13.3
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# App icon generation (Fomra logo) for every platform.
# Source icons are produced by: dart run tool/generate_app_icon.dart
# Regenerate icons with:        dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#2563EB"
# NOTE: this project only targets android / ios / web — there are no
# windows/ or macos/ platform folders, so those icons are not generated.
# If those platforms are added later, add `windows:` / `macos:` blocks here
# and re-run `dart run flutter_launcher_icons`.
